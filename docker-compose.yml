services:
  # ---------------------------------------------------------------------------
  # 1. Base de Datos Transaccional PostgreSQL 16 (Esquemas: parametros, erp, ia)
  # ---------------------------------------------------------------------------
  db:
    container_name: spartan-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spartan_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SpartanAdmin2026!}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - spartan_pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spartan_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spartan-network

  # ---------------------------------------------------------------------------
  # 2. Gateway ERP — Backend FastAPI (Kárdex ACID, Inventario, POS, Auth)
  # ---------------------------------------------------------------------------
  backend:
    container_name: spartan-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SpartanAdmin2026!}@db:5432/${POSTGRES_DB:-spartan_db}
      SECRET_KEY: ${SECRET_KEY:-e87b649d288d4041b31548e65813ec79f538e1245b738128362629b359f13775}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-SpartanAdmin2026!}
      ALGORITHM: ${ALGORITHM:-HS256}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-eW2FCKVBcWu130lj6GKr}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "8000:8000"
    networks:
      - spartan-network

  # ---------------------------------------------------------------------------
  # 3. Microservicio de IA Desacoplado (Visión Artificial & Biometría)
  # ---------------------------------------------------------------------------
  service-ia:
    container_name: spartan-ia
    build:
      context: .
      dockerfile: docker/ia.Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: "Spartan Biometric IA Microservice"
      PORT: ${IA_PORT:-8001}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SpartanAdmin2026!}@db:5432/${POSTGRES_DB:-spartan_db}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-eW2FCKVBcWu130lj6GKr}
    ports:
      - "${IA_PORT:-8001}:8001"
    networks:
      - spartan-network

  # ---------------------------------------------------------------------------
  # 4. Frontend SPA — Vite + React + Tailwind + Nginx
  # ---------------------------------------------------------------------------
  frontend:
    container_name: spartan-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - spartan-network

volumes:
  spartan_pgdata:
    driver: local

networks:
  spartan-network:
    driver: bridge
